plugins { id 'com.android.application' }

android {
    namespace 'org.disgaead2.bootstrap'
    compileSdk 35
    buildToolsVersion '35.0.0'
    ndkVersion '28.2.13676358'
    defaultConfig {
        applicationId 'org.disgaead2.bootstrap'
        minSdk 28
        targetSdk 35
        versionCode 13
        versionName '0.0.13-self-layout-test'
        // x86_64 is only for CI's Android emulator. Distributed APK stays ARM64.
        ndk { abiFilters project.hasProperty('d2EmulatorSmoke') ? 'x86_64' : 'arm64-v8a' }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static', '-DBUILD_TESTING=OFF',
                    '-DD2_ANDROID_EMULATOR_SMOKE=' + (project.hasProperty('d2EmulatorSmoke') ? 'ON' : 'OFF')
            }
        }
    }
    externalNativeBuild {
        cmake { path file('src/main/cpp/CMakeLists.txt'); version '3.22.1' }
    }
    sourceSets {
        main { assets.srcDirs += [rootProject.file('../android-runtime-core/licenses')] }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
