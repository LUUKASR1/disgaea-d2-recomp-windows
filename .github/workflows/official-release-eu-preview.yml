name: Validate DirectX 12 European preview package
run-name: Verify 1.0.54 European preview launcher and installer
on:
  push:
    branches: [eu-preview]
    paths: [.github/workflows/official-release-eu-preview.yml]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the verified assets as the v1.0.54-eu-preview pre-release'
        type: boolean
        default: false
      official:
        description: 'Official release: build the Windows package AND the Android APK, and with publish create the stable v1.0.54 release (latest) with both'
        type: boolean
        default: false
      android_release:
        description: 'Build the Android APK instead of the Windows package; with publish also create the android-v<versionName> pre-release'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: eu-preview-dx12
  cancel-in-progress: false
jobs:
  validate-package:
    if: github.repository == 'LUUKASR1/disgaea-d2-recomp-windows' && github.ref == 'refs/heads/eu-preview' && !inputs.android_release
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/requirements-lifts.txt py7zr==1.0.0 cmake==3.31.6 ninja==1.11.1.4
      - name: PyInstaller with a bootloader compiled on this runner
        run: python -m pip install --no-binary pyinstaller pyinstaller==6.22.0
      - name: Launcher and preparation regressions
        run: python -m unittest discover -s windows -p 'test_*.py' -v
      - name: Native DirectX 12 graphics and FSR regressions
        run: python tools/check_graphics.py
      - name: Native ISO reader regressions
        run: python tools/check_iso_vfs.py --sdk-directory iso-check-sdk
      - name: Actual official launcher UI
        run: python windows/preview_launcher.py --official
      - uses: actions/upload-artifact@v4
        with:
          name: Official-1.0.54-Launcher-UI
          path: launcher-previews/
      - name: Package official single-file launcher
        run: python tools/package_launcher.py --onefile --official
      - name: Test frozen launcher, native preparation and portable compilation
        timeout-minutes: 15
        shell: pwsh
        run: |
          $exe = (Resolve-Path dist/DisgaeaD2Launcher.exe).Path
          foreach ($argument in @('--self-test', '--native-preparation-test', '--toolchain-test')) {
            $process = Start-Process $exe -ArgumentList $argument -PassThru
            if (!$process.WaitForExit(780000)) { Stop-Process -Id $process.Id -Force; throw "$argument timed out" }
            $process.Refresh()
            if ($process.ExitCode -ne 0) {
              Get-Content "$env:LOCALAPPDATA/DisgaeaD2Recomp-Graphics-Preview/preparacao.log" -Tail 100 -ErrorAction SilentlyContinue
              throw "$argument failed: $($process.ExitCode)"
            }
          }
          foreach ($name in @('self-test-ok.txt', 'toolchain-test-ok.txt', 'native-preparation-test.log')) {
            if (!(Test-Path "$env:LOCALAPPDATA/DisgaeaD2Recomp-Graphics-Preview/$name")) { throw "Missing $name" }
          }
      - name: Build and verify installer with preservation of saves
        shell: pwsh
        run: |
          $compiler = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          $iscc = if ($compiler) { $compiler.Source } else {
            Get-ChildItem "${env:ProgramFiles(x86)}" -Directory -Filter 'Inno Setup*' |
              ForEach-Object { Join-Path $_.FullName 'ISCC.exe' } |
              Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (!$iscc) { throw 'Inno Setup missing' }
          & $iscc /DOfficialRelease windows/installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
          ./windows/test_installer.ps1 -OfficialRelease
      - name: Prepare public assets and checksums
        shell: python
        run: |
          from pathlib import Path
          import hashlib, json, os, shutil, zipfile
          out = Path('official-assets'); out.mkdir()
          for source in ('dist/DisgaeaD2Launcher.exe', 'dist-installer/DisgaeaD2Launcher-Setup-Windows-x64.exe'):
              data = Path(source).read_bytes()
              assert data[:2] == b'MZ' and len(data) > 1_000_000
              shutil.copy2(source, out / Path(source).name)
          with zipfile.ZipFile(out / 'DisgaeaD2Launcher-1.0.54-Windows-x64.zip', 'w', zipfile.ZIP_DEFLATED) as z:
              for source, name in [('dist/DisgaeaD2Launcher.exe', 'DisgaeaD2Launcher.exe'), ('docs/RELEASE-1.0.54.md', 'README.md'), ('LICENSE', 'LICENSE'), ('THIRD_PARTY_NOTICES.md', 'THIRD_PARTY_NOTICES.md')]:
                  z.write(source, name)
          (out / 'release-build.json').write_text(json.dumps({'version': '1.0.54', 'source_commit': os.environ['GITHUB_SHA'], 'renderer': 'd3d12', 'game_content_bundled': False}, indent=2))
          sums = ''.join(hashlib.sha256(p.read_bytes()).hexdigest() + '  ' + p.name + '\n' for p in sorted(out.iterdir()))
          (out / 'SHA256SUMS.txt').write_text(sums)
      - uses: actions/upload-artifact@v4
        with:
          name: DisgaeaD2-1.0.54-Official-Verified-Assets
          path: official-assets/
          if-no-files-found: error

  publish:
    # Only when started by hand with publish=true: the assets above were built and tested from this exact commit.
    if: github.event_name == 'workflow_dispatch' && inputs.publish && !inputs.android_release && !inputs.official && github.repository == 'LUUKASR1/disgaea-d2-recomp-windows' && github.ref == 'refs/heads/eu-preview'
    needs: validate-package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: DisgaeaD2-1.0.54-Official-Verified-Assets
          path: verified-assets
      - name: Verify checksums and publish the stable release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd verified-assets
          expected="DisgaeaD2Launcher.exe DisgaeaD2Launcher-Setup-Windows-x64.exe DisgaeaD2Launcher-1.0.54-Windows-x64.zip SHA256SUMS.txt release-build.json"
          for name in $expected; do test -s "$name" || { echo "missing $name"; exit 1; }; done
          test "$(ls | wc -l)" = 5
          sha256sum --check --ignore-missing SHA256SUMS.txt
          python3 - <<'PY'
          import json
          meta = json.load(open('release-build.json'))
          assert meta['version'] == '1.0.54' and meta['renderer'] == 'd3d12' and not meta['game_content_bundled']
          PY
          cd ..
          if gh release view v1.0.54-eu-preview >/dev/null 2>&1; then echo "v1.0.54-eu-preview already exists; refusing to overwrite"; exit 1; fi
          # Draft first, upload every asset, then make it public.
          gh release create v1.0.54-eu-preview --target "$GITHUB_SHA" --title "Disgaea D2 Windows 1.0.54 — European preview (BLES01939)" \
            --notes-file docs/RELEASE-1.0.54.md --draft --prerelease
          gh release upload v1.0.54-eu-preview verified-assets/* 
          gh release edit v1.0.54-eu-preview --draft=false --prerelease=true --latest=false
          gh release view v1.0.54-eu-preview --json url,isDraft,isPrerelease,assets --jq '.url'

  android-release:
    name: Android APK (and release when publish is on)
    if: github.event_name == 'workflow_dispatch' && (inputs.android_release || inputs.official) && github.repository == 'LUUKASR1/disgaea-d2-recomp-windows' && github.ref == 'refs/heads/eu-preview'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install pinned SDK and ARM64 toolchain
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: Build the release APK
        run: gradle -p android assembleRelease --no-daemon --stacktrace
      - name: Name, verify and checksum the APK
        id: pack
        run: |
          set -e
          version=$(grep -oP "versionName '\K[^']+" android/app/build.gradle)
          src=android/app/build/outputs/apk/release/app-release.apk
          test -f "$src"
          unzip -l "$src" | grep 'lib/arm64-v8a/libd2android.so'
          mkdir -p out
          name="Disgaea D2-Android-${version}.apk"
          cp "$src" "out/$name"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "out/$name" | tee out/cert.txt
          (cd out && sha256sum "$name" > SHA256SUMS.txt && cat SHA256SUMS.txt)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: DisgaeaD2-Android-release-apk
          path: |
            out/*.apk
            out/SHA256SUMS.txt
      - name: Publish the GitHub release
        if: ${{ inputs.publish && !inputs.official }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          version='${{ steps.pack.outputs.version }}'
          tag="android-v${version}"
          notes="docs/RELEASE-ANDROID-${version}.md"
          test -f "$notes"
          if gh release view "$tag" >/dev/null 2>&1; then echo "$tag already exists; refusing to overwrite"; exit 1; fi
          # Draft first, upload every asset, then make it public. Never "latest": that stays with the Windows release.
          gh release create "$tag" --target "$GITHUB_SHA" --title "Disgaea D2 Android ${version} — public preview (experimental)" \
            --notes-file "$notes" --draft --prerelease
          gh release upload "$tag" out/*.apk out/SHA256SUMS.txt
          gh release edit "$tag" --draft=false --prerelease=true --latest=false
          gh release view "$tag" --json url,isDraft,isPrerelease,assets --jq '.url'

  publish-official:
    # Official release: Windows package (validated above) + Android APK in ONE stable release, marked latest.
    if: github.event_name == 'workflow_dispatch' && inputs.official && inputs.publish && github.repository == 'LUUKASR1/disgaea-d2-recomp-windows' && github.ref == 'refs/heads/eu-preview'
    needs: [validate-package, android-release]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: DisgaeaD2-1.0.54-Official-Verified-Assets
          path: verified-assets
      - uses: actions/download-artifact@v4
        with:
          name: DisgaeaD2-Android-release-apk
          path: android-assets
      - name: Verify checksums and publish the official release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          (cd verified-assets
           for name in DisgaeaD2Launcher.exe DisgaeaD2Launcher-Setup-Windows-x64.exe DisgaeaD2Launcher-1.0.54-Windows-x64.zip SHA256SUMS.txt release-build.json; do test -s "$name" || { echo "missing $name"; exit 1; }; done
           test "$(ls | wc -l)" = 5
           sha256sum --check --ignore-missing SHA256SUMS.txt)
          (cd android-assets && test "$(ls *.apk | wc -l)" = 1 && sha256sum --check SHA256SUMS.txt)
          mv android-assets/SHA256SUMS.txt android-assets/SHA256SUMS-Android.txt
          tag=v1.0.54
          if gh release view "$tag" >/dev/null 2>&1; then echo "$tag already exists; refusing to overwrite"; exit 1; fi
          gh release create "$tag" --target "$GITHUB_SHA" --title "Disgaea D2 Recomp 1.0.54 — Windows + Android" --notes-file docs/RELEASE-1.0.54.md --draft
          gh release upload "$tag" verified-assets/* android-assets/*
          gh release edit "$tag" --draft=false --prerelease=false --latest=true
          gh release view "$tag" --json url,isDraft,isPrerelease,assets --jq '.url'
