name: Android release (public preview)
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the GitHub release (false = only build and keep the APK as an artifact)'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install pinned SDK and ARM64 toolchain
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: Build the release APK
        run: gradle -p android assembleRelease --no-daemon --stacktrace
      - name: Name, verify and checksum the APK
        id: pack
        run: |
          set -e
          version=$(grep -oP "versionName '\K[^']+" android/app/build.gradle)
          src=android/app/build/outputs/apk/release/app-release.apk
          test -f "$src"
          unzip -l "$src" | grep 'lib/arm64-v8a/libd2android.so'
          mkdir -p out
          name="Disgaea D2-Android-${version}.apk"
          cp "$src" "out/$name"
          # signature check: must verify and carry the project's fixed key
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "out/$name" | tee out/cert.txt
          (cd out && sha256sum "$name" > SHA256SUMS.txt && cat SHA256SUMS.txt)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: DisgaeaD2-Android-release-apk
          path: |
            out/*.apk
            out/SHA256SUMS.txt
      - name: Publish the GitHub release
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          version='${{ steps.pack.outputs.version }}'
          tag="android-v${version}"
          notes="docs/RELEASE-ANDROID-${version}.md"
          test -f "$notes"
          if gh release view "$tag" >/dev/null 2>&1; then echo "$tag already exists; refusing to overwrite"; exit 1; fi
          # Draft first, upload every asset, then make it public. Never "latest": that stays with the Windows release.
          gh release create "$tag" --target "$GITHUB_SHA" --title "Disgaea D2 Android ${version} — public preview (experimental)" \
            --notes-file "$notes" --draft --prerelease
          gh release upload "$tag" out/*.apk out/SHA256SUMS.txt
          gh release edit "$tag" --draft=false --prerelease=true --latest=false
          gh release view "$tag" --json url,isDraft,isPrerelease,assets --jq '.url'
