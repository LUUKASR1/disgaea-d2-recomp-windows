name: Windows launcher
on:
  push:
    paths:
      - 'windows/launcher.py'
      - 'windows/perfil.json'
      - 'windows/test_launcher.py'
      - 'tools/build_windows.py'
      - 'tools/bootstrap_windows.py'
      - 'tools/generate_lifts.py'
      - 'tools/package_launcher.py'
      - '.github/workflows/windows-launcher.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install packaging dependencies
        run: python -m pip install -r tools/requirements-lifts.txt pyinstaller==6.22.0 py7zr==1.0.0 cmake==3.31.6 ninja==1.11.1.4
      - name: Test preparation safeguards without game files
        run: python -m unittest discover -s windows -p test_launcher.py -v
      - name: Build source-only launcher
        run: python tools/package_launcher.py
      - name: Initialize installed C++ toolchain for CI
        shell: pwsh
        run: |
          @'
          import os, sys
          sys.path.insert(0, 'windows')
          from launcher import build_environment
          env = build_environment()
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              for name in ['PATH', 'LIB', 'INCLUDE', 'LIBPATH', 'VSINSTALLDIR', 'VCToolsInstallDir', 'WindowsSdkDir']:
                  value = next((v for k, v in env.items() if k.upper() == name.upper()), None)
                  if value:
                      output.write(name + '=' + value + '\n')
          '@ | python -
      - name: Provide Vulkan loader for headless CI (no GPU driver on runner)
        shell: pwsh
        run: |
          git clone --depth 1 --branch v1.4.350 https://github.com/KhronosGroup/Vulkan-Loader.git "$env:RUNNER_TEMP/vulkan-loader"
          cmake -S "$env:RUNNER_TEMP/vulkan-loader" -B "$env:RUNNER_TEMP/vulkan-build" -G Ninja -DCMAKE_BUILD_TYPE=Release -DUPDATE_DEPS=ON -DBUILD_TESTS=OFF -DCMAKE_INSTALL_PREFIX="$env:RUNNER_TEMP/vulkan-runtime"
          cmake --build "$env:RUNNER_TEMP/vulkan-build" --config Release --target install --parallel 2
          "$env:RUNNER_TEMP/vulkan-runtime/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Test bundled interpreter and dependencies
        timeout-minutes: 6
        shell: pwsh
        run: |
          $exe = Resolve-Path dist/DisgaeaD2Launcher/DisgaeaD2Launcher.exe
          function Run-Launcher($arguments) {
            $process = Start-Process $exe -ArgumentList $arguments -PassThru
            if (!$process.WaitForExit(180000)) {
              Stop-Process -Id $process.Id -Force
              Get-Content "$env:LOCALAPPDATA/DisgaeaD2Recomp/preparacao.log" -ErrorAction SilentlyContinue
              throw 'Launcher child timed out'
            }
            $process.Refresh()
            return $process
          }
          $process = Run-Launcher '--self-test'
          if ($process.ExitCode -ne 0) { throw 'Bundled self-test failed' }
          if (!(Test-Path "$env:LOCALAPPDATA/DisgaeaD2Recomp/self-test-ok.txt")) { throw 'Self-test marker missing' }
          $probe = Join-Path $env:RUNNER_TEMP 'probe.txt'
          $process = Start-Process $exe -ArgumentList '-c', '"import sys; print(sys.version_info[:3])"' -RedirectStandardOutput $probe -PassThru
          if (!$process.WaitForExit(15000)) { Stop-Process -Id $process.Id -Force; throw 'Worker timed out' }
          $process.Refresh()
          if ($process.ExitCode -ne 0 -or !(Get-Content $probe)) { throw 'Python worker probe failed' }
          $process = Run-Launcher '--toolchain-test'
          if ($process.ExitCode -ne 0 -or !(Test-Path "$env:LOCALAPPDATA/DisgaeaD2Recomp/toolchain-test-ok.txt")) {
            Get-Content "$env:LOCALAPPDATA/DisgaeaD2Recomp/preparacao.log"
            throw 'Bundled CMake, Ninja, compiler environment or Python discovery failed'
          }
          $process = Run-Launcher '--auxiliary-test'
          if ($process.ExitCode -ne 0 -or !(Test-Path "$env:LOCALAPPDATA/DisgaeaD2Recomp/auxiliary-test-ok.txt")) {
            Get-Content "$env:LOCALAPPDATA/DisgaeaD2Recomp/preparacao.log"
            throw 'Official helper download/extraction failed'
          }
      - uses: actions/upload-artifact@v4
        with:
          name: DisgaeaD2Launcher-Windows-x64
          path: dist/DisgaeaD2Launcher/
          if-no-files-found: error
