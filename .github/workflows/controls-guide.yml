name: Validate bilingual controls guide
on:
  push:
    branches: [feature/control-guide]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  controls-guide:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/requirements-lifts.txt py7zr==1.0.0
      - name: Keep the released game runtime unchanged
        run: git diff --exit-code v0.2.3 -- port patches tools/build_windows.py tools/build_iso_preview.py tools/prepare_owned_self.py tools/import_owned_pkg.py
      - name: Launcher regressions
        run: python -m unittest discover -s windows -p 'test_*.py' -v
      - name: Actual bilingual Windows UI
        run: python windows/preview_launcher.py --official
      - uses: actions/upload-artifact@v4
        with:
          name: Controls-Guide-PTBR-English-UI
          path: launcher-previews/
          if-no-files-found: error
