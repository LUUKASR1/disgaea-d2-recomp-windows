name: Android ARM64 Vulkan bootstrap
on:
  push:
    branches: [feature/android-bootstrap]
    paths: ['android/**', 'port/vulkan/**', '.github/workflows/android-bootstrap.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install pinned SDK and ARM64 toolchain
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: Compile Android app and reused Vulkan renderer
        run: gradle -p android assembleDebug lintDebug --no-daemon --stacktrace
      - name: Verify signed APK and actual AArch64 binary
        run: |
          python3 android/tools/verify_apk.py android/app/build/outputs/apk/debug/app-debug.apk \
            --aapt "$ANDROID_HOME/build-tools/35.0.0/aapt" \
            --apksigner "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            --readelf "$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 android/app/build/outputs/apk/debug/app-debug.apk
          mkdir android-download
          cp android/app/build/outputs/apk/debug/app-debug.apk android-download/DisgaeaD2-Android-0.0.2-Vulkan-Test-arm64.apk
          cp android/README.md android-download/README.md
          cp LICENSE THIRD_PARTY_NOTICES.md android-download/
          cd android-download
          sha256sum *.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: DisgaeaD2-Android-0.0.2-Vulkan-Test-arm64
          path: android-download/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-bootstrap-build-reports
          path: android/app/build/reports/
  android-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install pinned Android native tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: Build CI-only emulator ABI
        run: gradle -p android assembleDebug -Pd2EmulatorSmoke --no-daemon --stacktrace
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test actual Android surface and share UI
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -feature Vulkan -noaudio -no-boot-anim -camera-back none
          script: python3 android/tools/ui_smoke.py android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-0.0.2-Actual-UI-Smoke
          path: android-ui-smoke/
