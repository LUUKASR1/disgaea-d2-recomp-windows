name: Experimental ISO launcher
on:
  push:
    paths:
      - 'windows/performance_report.py'
      - 'windows/test_performance_report.py'
      - 'windows/launcher.py'
      - 'windows/launcher_gui.py'
      - 'windows/launcher_i18n.py'
      - 'windows/locales/**'
      - 'windows/test_launcher_i18n.py'
      - 'windows/texture_reuse_settings.py'
      - 'windows/test_texture_reuse_settings.py'
      - 'windows/test_iso_preview.py'
      - 'windows/display_settings.py'
      - 'windows/test_display_settings.py'
      - 'windows/frame_capture.py'
      - 'windows/test_frame_capture.py'
      - 'port/graphics/**'
      - 'tools/build_iso_preview.py'
      - 'tools/build_iso_reader.py'
      - 'tools/import_owned_pkg.py'
      - 'tools/prepare_owned_self.py'
      - 'windows/test_native_preparation.py'
      - 'tools/build_windows.py'
      - 'port/vfs/**'
      - 'tools/package_launcher.py'
      - '.github/workflows/iso-launcher.yml'
  pull_request:
    paths:
      - 'windows/performance_report.py'
      - 'windows/test_performance_report.py'
      - 'windows/launcher.py'
      - 'windows/launcher_gui.py'
      - 'windows/launcher_i18n.py'
      - 'windows/locales/**'
      - 'windows/test_launcher_i18n.py'
      - 'windows/texture_reuse_settings.py'
      - 'windows/test_texture_reuse_settings.py'
      - 'windows/test_iso_preview.py'
      - 'windows/display_settings.py'
      - 'windows/test_display_settings.py'
      - 'windows/frame_capture.py'
      - 'windows/test_frame_capture.py'
      - 'port/graphics/**'
      - 'tools/build_iso_preview.py'
      - 'tools/build_iso_reader.py'
      - 'tools/import_owned_pkg.py'
      - 'tools/prepare_owned_self.py'
      - 'windows/test_native_preparation.py'
      - 'tools/build_windows.py'
      - 'port/vfs/**'
      - 'tools/package_launcher.py'
      - '.github/workflows/iso-launcher.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/requirements-lifts.txt pyinstaller==6.22.0 py7zr==1.0.0 cmake==3.31.6 ninja==1.11.1.4
      - name: Test launcher and isolated ISO preparation
        run: python -m unittest discover -s windows -p 'test_*.py' -v
      - name: Capture actual branded launcher
        run: python windows/preview_launcher.py
      - uses: actions/upload-artifact@v4
        with:
          name: DisgaeaD2-ISO-Launcher-UI
          path: launcher-previews/
          if-no-files-found: error
      - name: Package single-file source-only launcher
        run: python tools/package_launcher.py --onefile
      - name: Test embedded interpreter
        shell: pwsh
        run: |
          $exe = Resolve-Path dist/DisgaeaD2Launcher-HUD-Output-Preview.exe
          $process = Start-Process $exe -ArgumentList '--self-test' -PassThru
          if (!$process.WaitForExit(120000)) { Stop-Process -Id $process.Id -Force; throw 'Self-test timed out' }
          $process.Refresh()
          if ($process.ExitCode -ne 0) { throw 'Embedded interpreter failed' }
          $renamed = Join-Path $env:RUNNER_TEMP 'DisgaeaD2.exe'
          Copy-Item $exe $renamed
          $process = Start-Process $renamed -ArgumentList '--native-preparation-test' -PassThru
          if (!$process.WaitForExit(120000)) { Stop-Process -Id $process.Id -Force; throw 'Native preparation tests timed out' }
          $process.Refresh()
          $profile = Join-Path $env:LOCALAPPDATA 'DisgaeaD2Recomp-Graphics-Preview'
          foreach ($name in @('native-preparation-test.log', 'preparacao.log')) {
            $log = Join-Path $profile $name
            if (Test-Path $log) { Get-Content $log -Tail 100 }
          }
          if ($process.ExitCode -ne 0) { throw 'Embedded PKG/SELF tests failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: DisgaeaD2Launcher-HUD-Output-Preview-Windows-x64
          path: dist/DisgaeaD2Launcher-HUD-Output-Preview.exe
          if-no-files-found: error
